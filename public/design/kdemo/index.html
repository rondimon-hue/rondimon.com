<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KDN Value Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen presenter tool. Top bar with build controls, the poster on a zoomable stage, a detail sidebar on the right (stacks under the poster on narrow screens). */
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --panel2:#F5F7FA; --fg:#0F1D33; --muted:#566378; --line:#D3DAE4;
  --navy:#0A1E3F; --amber:#B8770F; --btn:#0A1E3F; --btnfg:#FFFFFF; --focus:#2E6DA4; --stagebg:#DCE2EA;
  /* flow colors (same in both themes; they sit on the poster) */
  --plan:#5B3FD6; --f1:#CC126B; --f2:#ED6B00;
  /* poster: a fixed document look, same in both themes */
  --p-paper:#FFFFFF; --p-cell:#F3F6FA; --p-grid:#2E6DA4; --p-ink:#14233B; --p-navy:#0A1E3F; --p-navy2:#1B3F6E; --p-navy3:#3568A6;
  --p-amber:#E8A33D; --p-white:#FFFFFF; --p-box:#FFFFFF; --p-boxline:#93A1B5; --p-prim:#DCE6F5; --p-anchor:#FCEEC0; --p-risk:#D7F0DA; --p-sub:#C9D6EA;
  --sans: Arial, Helvetica, "Liberation Sans", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1422; --panel:#141F33; --panel2:#1A2740; --fg:#E8EDF5; --muted:#9FB0C8; --line:#2A3A56;
  --navy:#E8EDF5; --amber:#E8A33D; --btn:#E8A33D; --btnfg:#0A1E3F; --focus:#7FB2E5; --stagebg:#070D18; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1422; --panel:#141F33; --panel2:#1A2740; --fg:#E8EDF5; --muted:#9FB0C8; --line:#2A3A56;
  --navy:#E8EDF5; --amber:#E8A33D; --btn:#E8A33D; --btnfg:#0A1E3F; --focus:#7FB2E5; --stagebg:#070D18; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;min-height:36px}
.btn:hover{border-color:var(--focus)}
.btn.primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn);font-weight:bold;padding-inline:18px}
.btn:disabled{opacity:.45;cursor:default}
.count{font-variant-numeric:tabular-nums;min-width:74px;text-align:center;color:var(--muted);font-size:13px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .btn{padding:7px 10px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:6px}
.main{flex:1;min-height:0;display:flex;gap:12px}
.view{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--stagebg);border:1px solid var(--line);border-radius:8px;touch-action:pan-y}
.view.pan{cursor:grab}.view.panning{cursor:grabbing}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.kick{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:bold}
.card h2{margin:4px 0 8px;font-size:18px;line-height:1.25;text-wrap:balance}
.card h3{margin:4px 0 8px;font-size:15px;line-height:1.3}
.card p{margin:0 0 8px}
.roi{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.roi b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.src{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.sw{width:12px;height:12px;border:1px solid #93A1B5;display:inline-block;flex:none}
dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
dt{color:var(--muted)}dd{margin:0}
.links{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
.links button{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 8px;font-size:13px;display:flex;gap:8px;align-items:center}
.links button:hover{border-color:var(--focus)}
.lh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:bold;margin:8px 0 4px}
.x{float:right;border:0;background:none;color:var(--muted);font-size:13px;padding:0 2px;text-decoration:underline}
.steps{list-style:none;margin:0;padding:0;font-size:13px}
.steps .ch{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:bold;margin:10px 0 4px}
.steps .ch:first-child{margin-top:0}
.steps button{width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:5px;display:flex;gap:8px}
.steps button:hover{background:var(--panel2)}
.steps button .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:18px}
.steps button[aria-current="step"]{background:var(--btn);color:var(--btnfg);font-weight:bold}
.steps button[aria-current="step"] .n{color:inherit}
.steps button.done{color:var(--muted)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--p-navy);color:var(--p-white);padding:6px 9px;border-radius:5px;font-size:13px;max-width:260px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.3)}
@media (max-width: 900px){
  html,body{height:auto}
  .app{height:auto}
  .main{flex-direction:column}
  .view{flex:none;aspect-ratio:3/2;max-width:100%}
  .side{width:auto;overflow:visible}
}

/* ---------- poster (fixed 2592 x 1728 document, scaled by transform) ---------- */
#stage{position:absolute;left:0;top:0;width:2592px;height:1728px;transform-origin:0 0;background:var(--p-paper);color:var(--p-ink);font-family:var(--sans);line-height:1.15}
#stage.anim{transition:transform .5s ease}
.p-hdr{position:absolute;left:0;top:0;width:2592px;height:128px;background:var(--p-navy);color:var(--p-white);display:flex;align-items:center;justify-content:space-between;padding:0 34px}
.p-hdr .k{color:var(--p-amber);font-weight:bold;font-size:17px;letter-spacing:.2em}
.p-hdr .t{font-size:42px;font-weight:bold;margin:4px 0 5px}
.p-hdr .s{font-size:17px;color:var(--p-sub)}
.p-hdr .r{text-align:right;max-width:900px}
.p-hdr .r .o{font-size:11px;letter-spacing:.2em;color:var(--p-amber);font-weight:bold}
.p-hdr .r .g{font-size:19px;font-weight:bold;line-height:1.25;margin:5px 0 7px}
.p-hdr .badge{display:inline-block;border:1.5px solid var(--p-amber);color:var(--p-amber);font-size:12px;letter-spacing:.2em;padding:3px 10px;font-weight:bold}
.p-fh{position:absolute;top:128px;height:118px;color:var(--p-white);display:flex;align-items:center;gap:14px;padding:0 20px;border-left:3px solid var(--p-grid)}
.p-fh .n{width:46px;height:46px;border-radius:50%;background:var(--p-white);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;flex:none}
.p-fh .nm{font-size:23px;font-weight:bold;line-height:1.15}
.p-corner{position:absolute;left:0;top:128px;width:62px;height:118px;background:var(--p-navy)}
.p-lay{position:absolute;left:0;width:62px;color:var(--p-white);display:flex;align-items:center;justify-content:center;border-top:3px solid var(--p-grid)}
.p-lay span{display:inline-block;transform:rotate(-90deg);white-space:nowrap;font-weight:bold;font-size:22px;letter-spacing:.22em}
.p-cell{position:absolute;background:var(--p-cell);border-left:3px solid var(--p-grid);border-top:3px solid var(--p-grid)}
.drv{position:absolute;background:var(--p-box);border:1px solid var(--p-boxline);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 5px;font-size:16px;overflow:hidden;cursor:pointer;
  opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .35s ease, transform .35s ease, box-shadow .3s}
.drv.on{opacity:1;transform:none;pointer-events:auto}
.drv.p{background:var(--p-prim);font-weight:bold}.drv.a{background:var(--p-anchor);font-weight:bold}.drv.r{background:var(--p-risk);font-weight:bold}
.drv.fresh{box-shadow:0 0 0 3px var(--p-amber), 0 0 18px 4px rgba(232,163,61,.55)}
.drv.sel{box-shadow:0 0 0 5px var(--p-navy)}
.drv .sl{position:absolute;right:50%;transform:translateX(50%);top:1px;min-width:19px;height:17px;border-radius:9px;background:var(--plan);color:var(--p-white);font-size:11px;font-weight:bold;line-height:17px;padding:0 4px}
#wires,#lines{position:absolute;left:0;top:0;width:2592px;height:1728px;pointer-events:none;overflow:visible}
#lines{z-index:1}.drv{z-index:2}#wires{z-index:3}
#wires .ring{fill:none;stroke-width:4;opacity:0;transition:opacity .4s}
#wires .ring.on{opacity:1}
#lines .e{fill:none;stroke-width:3.5;opacity:0;transition:opacity .35s, stroke-dashoffset .7s ease .15s}
#lines .e.on{opacity:.92}
#lines .e.on.old{opacity:.38}
#lines .e.fresh{stroke-width:5.5}
#lines .e.sel,#lines .e.on.rel{opacity:1}
#lines .e.sel{stroke-width:8;opacity:1}
#lines .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:none;cursor:pointer}
#lines .hit.on{pointer-events:stroke}
#wires .tag{opacity:0;transition:opacity .4s}
#wires .tag.on{opacity:1}
#wires .tag text{font:bold 15px Arial, Helvetica, sans-serif;fill:#FFFFFF;text-anchor:middle}
.p-ft{position:absolute;left:0;top:1578px;width:2592px;height:150px;background:var(--p-navy);color:var(--p-white);padding:12px 34px 0;font-size:14px;border-top:3px solid var(--p-grid)}
.p-ft .row{display:flex;gap:44px;align-items:flex-start}
.p-ft h6{margin:0 0 6px;font-size:11px;letter-spacing:.2em;color:var(--p-amber)}
.p-ft .lg{display:flex;flex-direction:column;gap:4px}
.p-ft .lg div{display:flex;align-items:center;gap:8px;white-space:nowrap}
.p-ft .lg i{width:26px;height:14px;display:inline-block;border:1px solid var(--p-boxline);flex:none}
.p-ft .lg u{width:34px;height:0;border-top:4px solid;display:inline-block;flex:none}
.p-ft .oc{display:grid;grid-template-columns:repeat(3,auto);gap:3px 22px;font-size:13px;white-space:nowrap}
.p-ft .cp{position:absolute;left:34px;right:34px;bottom:8px;font-size:12px;color:var(--p-sub);text-align:center}
@media (prefers-reduced-motion: reduce){ .drv,#lines .e,#wires .ring,#wires .tag,#stage.anim{transition:none} }
</style>

<div class="app">
  <div class="bar">
    <div class="brand"><b>KDN Value Blueprint</b><span>Jedox planning models and value flows, built one click at a time</span></div>
    <div class="nav">
      <button class="btn" id="back" type="button">Back</button>
      <span class="count" id="count" aria-live="polite"></span>
      <button class="btn primary" id="next" type="button">Next</button>
    </div>
    <div class="tools">
      <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
      <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="fit" type="button">Fit poster</button>
      <button class="btn" id="focus" type="button">Zoom to this step</button>
      <label class="chk"><input type="checkbox" id="split"> Lines on a second click</label>
    </div>
  </div>
  <div class="main">
    <div class="view" id="view"><div id="stage"></div></div>
    <aside class="side">
      <div class="card" id="stepcard"></div>
      <div class="card" id="detail" hidden></div>
      <div class="card"><ol class="steps" id="steps"></ol></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

","ind"],"6O15":["FAC","out"],"6T7":["ALLOC","in"],"6T13":["ALLOC","ind"],"6O2":["ALLOC","out"],"6O5":["ALLOC","out"],"6S8":["ALLOC","res"],"4T15":["CP","in"],"4T6":["CP","ind"],"4O6":["CP","out"],"4O5":["CP","out"],"4S14":["CP","res"],"4T14":["REV","in"],"4T7":["REV","in"],"4T1":["REV","in"],"4T12":["REV","in"],"4T5":["REV","in"],"4T8":["REV","ind"],"4O14":["REV","out"],"4O7":["REV","res"],"1S7":["REV","out"],"6T0":["OH","in"],"6T11":["OH","ind"],"6O6":["OH","out"],"6S14":["OH","res"],"6T12":["FUND","ind"],"6O9":["FUND","out"],"6S12":["FUND","res"],"6T10":["FX","in"],"6T8":["FX","ind"],"6O14":["FX","out"],"6S7":["FX","res"]},"models":{"W":["Workforce: headcount and hours","Cost (volume)","India now; all centers on rollout",9],"PC":["Personnel cost","Cost","India; all centers",9],"CT":["Contractors","Cost","India; all centers",9],"DFC":["Per-head direct function costs","Cost","India; all centers",9],"FAC":["Facilities and IT overheads","Cost","India; all centers",10],"ALLOC":["Management and G&A allocation","Cost","India; all centers",10],"CP":["Cost-plus margin","Revenue (invoice basis)","Delivery centers; rule set by HQ",10],"REV":["OpCo revenue","Revenue","HQ, functional OpCos",11],"OH":["OpCo and Central overheads","Cost","HQ",11],"FUND":["Funding and investment","Both","HQ",11],"FX":["FX and constant currency","Both","HQ",11]},"edges":[["2T1","2O1","p",1,"Opening headcount is the starting balance for every cost center, geography, location and role."],["2T5","2O1","p",1,"Joiners are added in the month they start."],["2T7","2O1","p",1,"Attrition % produces monthly exits. Headcount less exits gives average FTE."],["2O1","2O8","p",1,"Average FTE times standard hours gives available hours by type."],["2T4","2O8","p",1,"Standard hours per FTE set the capacity of each head."],["2T10","2O8","p",1,"Target utilization splits available hours into utilized time and the rest."],["2T11","2O8","p",1,"Approved project hours and lent hours are entered directly. They are independent inputs, not calculated."],["2O1","2O7","p",2,"Headcount by designation is the volume that personnel cost is priced on."],["2T8","2O7","p",2,"Headcount times average cost by designation gives base compensation."],["2T9","2O7","p",2,"Bonus %, gratuity and leave %, other personnel % and COLA are applied on base compensation."],["2T15","2O7","p",2,"Secondee and borrowing cost and one-offs are entered directly."],["2O7","2O14","p",2,"Total personnel cost divided by average FTE gives cost per FTE by designation."],["2T12","2O10","p",3,"Contractor headcount times hours times cost per hour, by vendor and role. Vendor rate changes are entered as they happen."],["2O10","2O8","p",3,"Contractor hours count in utilization alongside employee hours."],["2T5","2O12","p",4,"Each new joiner carries a recruitment cost."],["2T14","2O12","p",4,"Recruitment cost per hire times joiners gives hiring cost."],["2T14","2O9","p",4,"Transport is a rate per head times headcount."],["5T13","2O9","p",4,"Training and welfare are rates per head times headcount. Travel and other DFC are entered directly."],["2O12","2O9","p",4,"Recruitment is one of the four per-head direct function cost lines."],["2O1","2O9","p",4,"Monthly headcount is the volume for every per-head rate."],["2O14","2S6","p",5,"Personnel cost per FTE is the largest part of direct cost per head."],["2O10","2S6","p",5,"Contractor cost is added to employee cost for the same center and role."],["2O9","2S6","p",5,"Per-head direct function costs complete the direct cost of a head."],["6T15","6O15","p",6,"Location headcount times cost per seat gives facility cost by location."],["6T6","6O15","p",6,"IT cost per user times users gives IT cost by location."],["6T5","6O15","p",6,"Lease renewals and fit-outs are entered directly when they are known."],["2O1","6O15","p",6,"The same monthly headcount from the workforce model drives seats and IT users. One headcount, used everywhere."],["6O15","6O2","p",7,"Facility and IT cost by location is allocated with the rest of the overhead pool."],["6T7","6O2","p",7,"Function and business-unit headcount is the allocation base."],["6T13","6O2","p",7,"Named cost centers (codes 100 to 105) carry a fixed % override instead of the headcount base."],["6O2","6O5","p",7,"Step one moves G&A to management. Step two moves management to the business cost centers."],["6O5","6S8","p",7,"The allocation lands on business cost centers by geography, which completes cost-to-serve."],["2S6","6S8","p",7,"Direct cost per head plus allocated overhead gives the fully allocated cost of a delivery center."],["6O5","4O6","p",8,"Fully allocated cost is the base that the markup is applied to."],["4T15","4O6","p",8,"Allocated cost times markup % by geography: India 20%, contracted centers 14%. HQ sets the rule."],["4T6","4O6","p",8,"Fixed-fee arrangements are entered directly and sit outside the markup rule."],["4O6","4O5","p",8,"Cost plus markup plus the GDC tax provision gives the invoice basis for each member firm."],["4O5","4S14","p",8,"Invoice basis less allocated cost is the cost-plus margin each center earns."],["4T14","4O14","p",9,"Time and materials: hours times bill rate by band. Rate cards are annual and OpCo-owned."],["4T7","4O14","p",9,"Fully loaded: FTEs times an annual rate."],["4T1","4O14","p",9,"Fixed monthly or subscription fee, entered per solution."],["4T12","4O14","p",9,"Per unit: units times price times clients."],["4T5","4O14","p",9,"Discounts and recovery % reduce gross revenue to what is actually billed."],["4T8","4O14","p",9,"Pass-through, recoverable expenses and intercompany adjustments are entered directly."],["2O8","4O14","p",9,"Hours for the revenue row come from the delivery-center workforce model. The cost side and the revenue side share one set of hours."],["4O14","4O7","p",9,"Solution revenue less direct cost gives CM1. Each further cost layer gives CM2 and CM3."],["4O5","4O7","p",9,"What a delivery center invoices is the OpCo cost of delivery, so the invoice basis sets contribution margin."],["4O14","1S7","p",9,"Monthly solution revenue is split into secured multi-year and resold."],["6T0","6O6","p",10,"Headcount or revenue share by solution is the allocation key."],["6T11","6O6","p",10,"OpCo management, PMO, QA and legal are entered directly by category."],["6O6","6S14","p",10,"OpCo and Central allocation lines show how much overhead each solution absorbs."],["6O6","4O7","p",10,"Allocated OpCo and Central overhead takes contribution margin down to CM3."],["6T12","6O9","p",11,"Project schedules by month and their funding source (KISL, Global Function). All inputs are independent."],["6O9","6S12","p",11,"Net investment, new services and Tier 2 are taken out to reach adjusted operating income."],["4O7","6S12","p",11,"Contribution margin by solution is the starting point for operating income."],["6S14","6S12","p",11,"Overhead absorbed by solution sits between contribution margin and operating income."],["6T10","6O14","p",12,"A budget rate per currency and a monthly actual rate translate every center into USD."],["6T8","6O14","p",12,"Rate policy decides the constant rate: a January to May average or a single month."],["6O14","6S7","p",12,"USD at actual and USD at constant are reported side by side, so consolidation ties out in every currency."],["6O14","6S12","p",12,"FX impact on revenue and cost is separated from operating performance."],["1T12","1O15","o",14,""],["1O15","1S3","o",14,""],["1S3","1S0","o",14,""],["1O15","2O0","o",14,""],["2T6","2O0","o",14,""],["2O0","2S2","o",14,""],["2S2","2S0","o",14,""],["2O0","2O15","o",14,""],["2O15","2S3","o",14,""],["2O10","2S3","o",14,""],["2O12","2S3","o",14,""],["2O3","2S3","o",14,""],["2O0","3O0","o",14,""],["3O0","3S2","o",14,""],["6O10","6S1","o",14,""],["2O1","2O0","b",14,"The driver-based headcount forecast is the monthly headcount model from slide 9. Accuracy is measured against it."],["2O1","2O15","b",14,"Planned monthly headcount is the budget that actual headcount is compared with."],["2O8","2O3","b",14,"Available hours less utilized time is bench time, priced at cost per FTE."],["2O8","3O0","b",14,"Utilized hours by center are the capacity side of the capacity-to-demand balance."],["2O7","2S3","b",14,"Personnel cost is the numerator of workforce cost as a % of revenue."],["2S6","3S2","b",14,"Direct cost per head by center is what makes cost arbitrage between centers measurable."],["6O15","6O10","b",14,"Facility and IT cost by location is the plan that overhead variance is measured against."],["2S2","5S4","o",15,""],["5O9","5S1","o",15,""],["5S1","5S4","o",15,""],["5O13","5S8","o",15,""],["5S8","5S4","o",15,""],["5S4","4S1","o",15,""],["5O1","4O8","o",15,""],["4O8","4S2","o",15,""],["4O4","4S2","o",15,""],["4S2","1S9","o",15,""],["1S9","1S0","o",15,""],["4O14","4S1","b",15,"Monthly solution revenue is the numerator of revenue per FTE."],["2O1","4S1","b",15,"Average FTE from the workforce model is the denominator of revenue per FTE."],["4T14","4O4","b",15,"Bill rate by band is one side of rate erosion."],["2O14","4O4","b",15,"Cost per FTE by designation is the cost rate on the other side of rate erosion."],["2O8","5O1","b",15,"Hours by type are the baseline that AI hours saved are measured against."],["4T13","4O3","m",16,""],["4T3","4O3","m",16,""],["4T13","4O0","m",16,""],["4T10","4O0","m",16,""],["4T10","4S10","m",16,""],["4O3","4S4","m",16,""],["4O0","4S0","m",16,""],["4S4","4S0","m",16,""],["4S10","4S0","m",16,""],["3T7","3O3","m",16,""],["3O3","3O8","m",16,""],["3O8","3S1","m",16,""],["4O0","5S4","m",16,""],["2T0","2O3","m",16,""],["2O3","5S4","m",16,""],["5T8","5O1","m",16,""],["5O1","5S4","m",16,""],["4T5","4S10","b",16,"Planned discounts and recovery % are the baseline that discount leakage is measured against."],["4O5","4O0","b",16,"Invoice basis by member firm against actual billing shows realization by delivery center."],["4O7","3S1","b",16,"Contribution margin by solution is the plan that engagement margin by solution line reports against."],["6T9","6O4","m",17,""],["6O4","6S4","m",17,""],["6O11","6S7","m",17,""],["6S7","6S4","m",17,""],["6S10","6S4","m",17,""],["6T3","6O1","m",17,""],["6O1","6S1","m",17,""],["6O0","6S4","m",17,""],["6O0","6S5","m",17,""],["6S1","6S0","m",17,""],["6S5","6S0","m",17,""],["6O2","6O0","b",17,"A two-step allocation that runs in the model, with an audit trail, is what makes allocation transparent by center."],["6O5","6O1","b",17,"Planned allocation by business cost center is compared with actual shared cost every month."],["6O6","6S4","b",17,"OpCo and Central allocation lines complete the P&L by solution."],["4O7","6S4","b",17,"Contribution margin CM1 to CM3 is the solution P&L that visibility coverage measures."],["6S8","6S0","b",17,"Cost-to-serve by center, on one basis, is how footprint cost efficiency is compared."]],"tags":{"6S10":["M1","Hyperion retired, one close across centers"],"6S4":["M2","P&L by solution, center and function"],"4S0":["M3","Global fee realization"],"3S1":["M4","Engagement margin by solution line"],"6S0":["M5","Footprint cost efficiency"],"5S4":["M6","Leverage ratio shift"],"1S3":["P1","Pipeline-to-capacity coverage"],"2S0":["P2","Global leverage ratio and AI-adjusted staffing"],"2S3":["P3","Workforce cost as % of revenue"],"3S2":["P4","Delivery center cost arbitrage"],"4S2":["P5","Value-based pricing"],"4S1":["P6","Revenue per FTE"]},"steps":[{"ch":"Frame","t":"The blueprint construct","src":"","hl":[],"body":"Six delivery functions across the top. Three layers down the side: strategic outcomes, operational levers, tactical signals. Every driver on this map sits at one intersection of a function and a layer.","roi":"Nothing is placed yet. The next clicks build the Jedox planning model onto this frame, one planning model at a time, in the order the rollout plan delivers it."},{"ch":"Slide 9 · Delivery center cost","t":"Workforce: headcount and hours","src":"Rollout plan, slide 9, row 1","hl":[],"body":"Opening headcount by cost center, geography, location and role. Add joiners, apply attrition %. Standard hours and target utilization turn heads into hours. The model returns monthly headcount, exits, average FTE, hours by type and utilized time.","roi":"This is the volume model behind every cost line that follows. It is validated against FY26 actuals before go-live."},{"ch":"Slide 9 · Delivery center cost","t":"Personnel cost","src":"Rollout plan, slide 9, row 2","hl":[],"body":"Headcount times average cost by designation, then bonus %, gratuity and leave %, other personnel % and COLA. Secondee and borrowing cost and one-offs are entered directly. The output is base compensation, bonus, gratuity, insurance and cost per FTE.","roi":"Personnel cost is the largest line in a delivery center. Change one assumption and every month and every role reprices."},{"ch":"Slide 9 · Delivery center cost","t":"Contractors","src":"Rollout plan, slide 9, row 3","hl":[],"body":"Contractor headcount times hours times cost per hour, by vendor and role. Contractor hours also count in utilization, so they flow back into the hours model.","roi":"Contractor spend against budget is already on the blueprint as a fee-leakage driver. It now has a driver-based plan behind it."},{"ch":"Slide 9 · Delivery center cost","t":"Per-head direct function costs","src":"Rollout plan, slide 9, row 4","hl":[],"body":"Headcount times a rate per head for training, welfare and transport. Recruitment is a cost per hire, driven by joiners. Travel and other DFC are entered directly.","roi":"These lines are small individually and are usually planned by hand in separate templates. Here they follow headcount automatically."},{"ch":"Slide 9 · Delivery center cost","t":"Outcome: direct cost per head","src":"Rollout plan, slide 9","hl":["2S6"],"body":"Personnel cost per FTE, plus contractors, plus per-head direct function costs, gives the direct cost of a head by center and role.","roi":"Phase 1A, about 60 days, India go-live 31 March 2027. T he India finance charge under the SSA that ends when Hyperion is switched off, and the 25 to 30 templates retired."},{"ch":"Revenue per consultant and margin","t":"Capacity and workforce cost","src":"Blueprint value flow: budgeting, planning and forecasting (P1 to P4)","hl":[],"body":"The planning models now reach the drivers already circled on the blueprint. Pipeline is checked against capacity. The headcount forecast drives the AI-adjusted staffing model, bench time, headcount variance and workforce cost as % of revenue.","roi":"Dashed lines show where a slide 9, 10 or 11 planning driver feeds a blueprint driver. Outcomes: P1 pipeline-to-capacity coverage, P2 leverage ratio, P3 workforce cost as % of revenue, P4 delivery center cost arbitrage."},{"ch":"Revenue per consultant and margin","t":"Revenue per consultant","src":"Blueprint value flow: budgeting, planning and forecasting (P5, P6)","hl":["4S1"],"body":"Revenue per FTE is monthly solution revenue over average FTE, both from the planning models. AI hours saved are repriced instead of given away, rate erosion is tracked against cost rate, and value-based pricing protects pricing realization.","roi":"Outcomes: P5 value-based pricing adoption and P6 revenue per FTE. Phase 3 demand planning (about 30 days, September onward) closes the loop from member-firm demand to center capacity."},{"ch":"Revenue per consultant and margin","t":"Margin: realization and leakage","src":"Blueprint value flow: close, consolidation and management reporting (M3, M4, M6)","hl":["4S0","3S1"],"body":"Actuals reported on the same structure as the plan. Write-offs, credit memos and discount leakage roll up to global fee realization. Rework cost rolls up to engagement margin by solution line. Bench cost and AI hours saved show in the leverage ratio.","roi":"Outcomes: M3 global fee realization, M4 engagement margin by solution line, M6 leverage ratio shift."},{"ch":"Revenue per consultant and margin","t":"Margin: one close, solution P&L, fo     if(D.tags[k]&&ringOn(k,D.tags[k][0][0]==='M'?'m':'o')) h+='<p><b>Outcome '+D.tags[k][0]+':</b> '+esc(D.tags[k][1])+'</p>';
    const ins=EDG.filter(e=>e.b===k&&edgeOn(e)),outs=EDG.filter(e=>e.a===k&&edgeOn(e));
    const li=(e,o)=>'<li><button type="button" data-edge="'+e.i+'"><span class="dot" style="background:'+KIND[e.k][1]+'"></span><span>'+nodeLine(o)+'</span></button></li>';
    if(ins.length) h+='<div class="lh">Driven by</div><ul class="links">'+ins.map(e=>li(e,e.a)).join('')+'</ul>';
    if(outs.length) h+='<div class="lh">Drives</div><ul class="links">'+outs.map(e=>li(e,e.b)).join('')+'</ul>';
    if(!ins.length&&!outs.length) h+='<p class="src">'+(ns[k]===LAST&&!ringOrder(k).length?'Not yet connected to a planning model or value flow. A candidate for later phases.':'Connections appear as the build continues.')+'</p>';
  }else{const e=EDG[sel.i];
    let note=e.note;
    if(!note) note=e.k==='m'?'Actuals for the first driver are closed and reported on the same structure as the second, so the roll-up is automatic and auditable.':'The first driver is a planning input to the second, so a change in one reforecasts the other.';
    h+='<div class="kick">Connection</div><h3>'+nodeLine(e.a)+' <span style="color:'+KIND[e.k][1]+'">→</span> '+nodeLine(e.b)+'</h3>'+
      '<div class="chips"><span class="chip"><span class="dot" style="background:'+KIND[e.k][1]+'"></span>'+KIND[e.k][0]+'</span></div><p>'+esc(note)+'</p>'+
      (D.tags[e.b]&&e.k!=='p'&&e.k!=='b'?'<p><b>Outcome '+D.tags[e.b][0]+':</b> '+esc(D.tags[e.b][1])+'</p>':'')+
      '<ul class="links"><li><button type="button" data-node="'+e.a+'"><span>From: '+nodeLine(e.a)+'</span></button></li><li><button type="button" data-node="'+e.b+'"><span>To: '+nodeLine(e.b)+'</span></button></li></ul>'}
  d.innerHTML=h}
function go(n,h){step=Math.max(0,Math.min(LAST,n));half=!!h;if(sel&&((sel.t==='n'&&!nodeOn(sel.k))||(sel.t==='e'&&!edgeOn(EDG[sel.i]))))sel=null;render();if(!fitMode)focusStep()}
const hasEdges=s=>EDG.some(e=>e.s===s);
function next(){if(half){go(step,false);return} if(step>=LAST)return; go(step+1,splitMode&&hasEdges(step+1))}
function back(){if(half){go(step-1,false);return} if(step<=0)return; go(step-1,false)}
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;
document.getElementById('split').onchange=e=>{splitMode=e.target.checked;if(!splitMode&&half)go(step,false)};
document.getElementById('steps').onclick=e=>{const b=e.target.closest('[data-step]');if(b)go(+b.dataset.step,false)};
document.getElementById('detail').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.clear)sel=null;else if(b.dataset.edge)sel={t:'e',i:+b.dataset.edge};else if(b.dataset.node)sel={t:'n',k:b.dataset.node};render()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){next();e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){back();e.preventDefault()}
  else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(LAST)}
  else if(e.key==='Escape'){sel=null;render()}
  else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('drv')){sel={t:'n',k:e.target.dataset.k};render();e.preventDefault()}});

/* ---------- zoom and pan ---------- */
let Z={s:1,x:0,y:0};
const apply=a=>{stage.classList.toggle('anim',!!a&&!reduce);stage.style.transform='translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')';view.classList.toggle('pan',!fitMode)};
function fit(a){const r=view.getBoundingClientRect();if(!r.width)return;const s=Math.min(r.width/W,r.height/H);Z={s,x:(r.width-W*s)/2,y:(r.height-H*s)/2};fitMode=true;apply(a)}
function zoomAt(f,px,py){const r=view.getBoundingClientRect();px=px??r.width/2;py=py??r.height/2;const min=Math.min(r.width/W,r.height/H);
  const s=Math.max(min,Math.min(2.2,Z.s*f));if(s<=min*1.001){fit(true);return}
  Z.x=px-(px-Z.x)*s/Z.s;Z.y=py-(py-Z.y)*s/Z.s;Z.s=s;fitMode=false;apply(false)}
function focusStep(){let ks=Object.keys(ns).filter(k=>ns[k]===step&&step<LAST);
  const es=EDG.filter(e=>e.s===step);es.forEach(e=>ks.push(e.a,e.b));ks=ks.concat(D.steps[step].hl);
  if(sel) ks=sel.t==='n'?[sel.k]:[EDG[sel.i].a,EDG[sel.i].b];
  if(!ks.length){fit(true);return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ks.forEach(k=>{const p=pos(k);x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+BW);y1=Math.max(y1,p.y+BH)});
  const m=90;x0-=m;y0-=m;x1+=m;y1+=m;const r=view.getBoundingClientRect(),min=Math.min(r.width/W,r.height/H);
  const s=Math.max(min,Math.min(1.5,r.width/(x1-x0),r.height/(y1-y0)));if(s<=min*1.02){fit(true);return}
  Z={s,x:r.width/2-(x0+x1)/2*s,y:r.height/2-(y0+y1)/2*s};fitMode=false;apply(true)}
document.getElementById('fit').onclick=()=>fit(true);
document.getElementById('zin').onclick=()=>zoomAt(1.3);document.getElementById('zout').onclick=()=>zoomAt(1/1.3);
document.getElementById('focus').onclick=focusStep;
view.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey&&fitMode&&e.deltaY>0)return;e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null,moved=false;
view.addEventListener('pointerdown',e=>{moved=false;if(fitMode||e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,zx:Z.x,zy:Z.y}});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;view.classList.add('panning')}
  if(moved){Z.x=drag.zx+dx;Z.y=drag.zy+dy;apply(false)}});
window.addEventListener('pointerup',()=>{drag=null;view.classList.remove('panning')});
view.addEventListener('click',e=>{if(moved){moved=false;return}
  const b=e.target.closest('.drv'),h=e.target.closest('.hit');
  if(b)sel={t:'n',k:b.dataset.k};else if(h)sel={t:'e',i:+h.dataset.e};else sel=null;render()});
new ResizeObserver(()=>{if(fitMode)fit(false)}).observe(view);

/* tooltip with the full label, for when the poster is small on screen */
const tip=document.getElementById('tip');
view.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'){tip.hidden=true;return}
  const b=e.target.closest('.drv'),h=e.target.closest('.hit');let t='';
  if(b)t=D.drivers[b.dataset.k][0];else if(h){const x=EDG[+h.dataset.e];t=D.drivers[x.a][0]+' → '+D.drivers[x.b][0]}
  if(!t){tip.hidden=true;return}
  tip.textContent=t;tip.hidden=false;const w=tip.offsetWidth;tip.style.left=Math.min(window.innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+16)+'px'});
view.addEventListener('pointerleave',()=>{tip.hidden=true});

fit(false);render();
window.__kdn={go,ns,EDG,box};
</script>

</body></html>
